<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Apresentação Executiva: Centro de Distribuição de Serviços</title>
  <style>
    /* ==========================================================================
       RESET E ESTILOS GERAIS EMBUTIDOS (100% OFFLINE E INDEPENDENTE DE CDN)
       Funciona perfeitamente em celulares (Android/iOS), tablets e computadores.
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #0B0F19;
      --surface: #111827;
      --card-bg: #1E293B;
      --card-border: #334155;
      --primary: #10B981;
      --primary-dark: #059669;
      --primary-light: rgba(16, 185, 129, 0.15);
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --danger-border: rgba(239, 68, 68, 0.35);
      --danger-text: #F87171;
      --success-bg: rgba(16, 185, 129, 0.12);
      --success-border: rgba(16, 185, 129, 0.35);
      --success-text: #34D399;
      --amber-bg: rgba(245, 158, 11, 0.12);
      --amber-border: rgba(245, 158, 11, 0.35);
      --amber-text: #FBBF24;
      --blue-bg: rgba(59, 130, 246, 0.12);
      --blue-border: rgba(59, 130, 246, 0.35);
      --blue-text: #60A5FA;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
    }

    /* Container Principal */
    .app-container {
      width: 100%;
      max-width: 1080px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: auto;
    }

    /* Barra Superior */
    .top-bar {
      background-color: var(--surface);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--primary-light);
      border: 1px solid var(--primary);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.5px;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .nav-indicator {
      font-family: monospace;
      font-size: 12px;
      font-weight: bold;
      color: var(--primary);
      background: #060911;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      white-space: nowrap;
    }

    /* Viewport do Slide */
    .slide-viewport {
      background: var(--surface);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 18px;
      min-height: 520px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      touch-action: pan-y;
      overflow-y: auto;
    }

    @media (min-width: 768px) {
      .slide-viewport {
        padding: 32px;
        min-height: 580px;
      }
    }

    /* Conteúdo do Slide */
    .slide-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .slide-header {
      margin-bottom: 16px;
    }

    .slide-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .slide-title {
      font-size: 20px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.3;
    }

    .slide-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    @media (min-width: 768px) {
      .slide-title { font-size: 28px; }
      .slide-subtitle { font-size: 15px; }
    }

    /* Grid & Cards Responsivos */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 640px) {
      .grid-2 { grid-template-columns: 1fr 1fr; }
      .grid-3 { grid-template-columns: repeat(3, 1fr); }
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
    }

    @media (min-width: 900px) {
      .grid-4 { grid-template-columns: repeat(4, 1fr); }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
    }

    .card-danger {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: #FECACA;
    }

    .card-success {
      background: var(--success-bg);
      border: 1.5px solid var(--primary);
      color: #D1FAE5;
    }

    .card-amber {
      background: var(--amber-bg);
      border: 1px solid var(--amber-border);
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card ul {
      list-style: none;
      font-size: 12.5px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card li {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      line-height: 1.4;
    }

    /* Slide de Capa */
    .cover-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      justify-content: center;
      height: 100%;
      padding: 10px 0;
    }

    .cover-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 20px;
      background: var(--primary-light);
      border: 1px solid var(--primary);
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      width: fit-content;
    }

    .cover-title {
      font-size: 26px;
      font-weight: 900;
      line-height: 1.2;
      color: #FFFFFF;
    }

    .cover-title span {
      color: var(--primary);
    }

    .cover-sub {
      font-size: 14px;
      color: #CBD5E1;
      line-height: 1.4;
    }

    .quote-box {
      background: rgba(15, 23, 42, 0.7);
      border-left: 4px solid var(--primary);
      padding: 12px 14px;
      border-radius: 8px;
      font-style: italic;
      font-size: 13px;
      color: #A7F3D0;
    }

    .pill-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: #E2E8F0;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 8px;
    }

    @media (min-width: 768px) {
      .cover-title { font-size: 42px; }
      .cover-sub { font-size: 18px; }
      .quote-box { font-size: 15px; padding: 16px; }
    }

    /* Barra de Navegação Inferior (Mobile Friendly) */
    .bottom-bar {
      background: var(--surface);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #064E3B;
      font-weight: 700;
    }

    .btn-notes {
      color: var(--amber-text);
      border-color: var(--amber-border);
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    /* Caixa de Notas do Orador */
    .notes-box {
      background: #181F2E;
      border: 1px solid var(--amber-border);
      border-radius: 16px;
      padding: 14px;
      display: none;
      animation: fadeIn 0.2s ease-in;
    }

    .notes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #283347;
      padding-bottom: 6px;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--amber-text);
      text-transform: uppercase;
    }

    .notes-text {
      font-size: 13px;
      color: #E2E8F0;
      line-height: 1.5;
    }

    /* Rodapé do Slide */
    .slide-footer {
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 10px;
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-muted);
    }

    /* Swipe Hint para Celulares */
    .swipe-hint {
      text-align: center;
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Barra Superior -->
    <header class="top-bar">
      <div class="brand-group">
        <div class="badge-icon">CD</div>
        <div>
          <div class="brand-title">CENTRO DE DISTRIBUIÇÃO</div>
          <div class="brand-sub">Prestação de Serviços • Modelo Asset-Light</div>
        </div>
      </div>
      <div id="slideIndicator" class="nav-indicator">1 / 12</div>
    </header>

    <!-- O Slide (Responsivo e com Suporte a Touch Swipe) -->
    <main id="slideViewport" class="slide-viewport">
      <div id="slideContent" class="slide-body">
        <!-- Inserido dinamicamente via JS -->
      </div>
      <footer class="slide-footer">
        <span>Modelo de Negócio — CD de Serviços</span>
        <span>Sem Compra e Sem Revenda</span>
      </footer>
    </main>

    <!-- Dica de gesto para celulares -->
    <div class="swipe-hint">👉 Deslize para os lados (swipe) ou use os botões abaixo</div>

    <!-- Barra Inferior de Navegação -->
    <nav class="bottom-bar">
      <button id="prevBtn" class="btn" onclick="prevSlide()">
        <span>◀</span> Anterior
      </button>
      
      <button class="btn btn-notes" onclick="toggleNotes()">
        🎙️ <span class="notes-btn-text">Roteiro</span>
      </button>

      <button id="nextBtn" class="btn btn-primary" onclick="nextSlide()">
        Próximo <span>▶</span>
      </button>
    </nav>

    <!-- Caixa de Notas do Orador -->
    <div id="speakerNotesBox" class="notes-box">
      <div class="notes-header">
        <span>🎙️ Roteiro de Apresentação (Notas do Orador)</span>
        <span style="font-size: 10px; color: var(--text-muted); cursor: pointer;" onclick="toggleNotes()">[Fechar ✕]</span>
      </div>
      <p id="speakerNotesText" class="notes-text"></p>
    </div>

  </div>

  <script>
    /* ==========================================================================
       DADOS E LÓGICA DA APRESENTAÇÃO (100% EMBUTIDA E LEVE)
       ========================================================================== */
    const slides = [
      {
        id: 1,
        tag: "Apresentação Estratégica",
        title: "CENTRO DE DISTRIBUIÇÃO DE SERVIÇOS",
        notes: "Prezados, hoje apresento o projeto de estruturação do nosso Centro de Distribuição de Prestação de Serviços. Trata-se de um modelo inovador que rompe com a lógica tradicional do comércio atacadista: nós não compramos nem revendemos mercadorias. Atuamos como a infraestrutura física e comercial que viabiliza, organiza e acelera o fluxo entre quem produz e quem compra, operando de forma enxuta e sem risco de volatilidade de estoque.",

      {
        id: 2,

              </ul>
            </div>

      {
        id: 3,

        title: "Fluxo da Operação e Custódia",

        notes: "Aqui visualizamos o caminho da mercadoria. O produtor descarrega em nosso hub. Imediatamente aplicamos rigorosa conferência de qualidade e quantidade. O produto fica guardado sob condições ideais. Assim que os pedidos dos compradores são fechados na nossa mesa de intermediação, fazemos a separação e preparamos a expedição. O comprador recebe seu pedido consolidado com rapidez, e o produtor recebe o pagamento diretamente.",
        render: () => `

          <div class="grid-3" style="margin-bottom: 12px;">

                • Pagamento direto ao produtor.
              </p>
            </div>
          </div>
          <div class="card card-amber">
            <p style="font-size: 11.5px; color: var(--amber-text); line-height: 1.4;">
              <strong>Regra de Custódia:</strong> A mercadoria continuará pertencendo ao produtor ou ao comprador, conforme a negociação realizada entre as partes. A empresa prestará <em>apenas os serviços contratados</em>.
            </p>
          </div>

      {

        render: () => `
          <div class="slide-header">

    let currentSlide = 0;
    let notesOpen = false;

    function updateView() {
      const slide = slides[currentSlide];
      const container = document.getElementById("slideContent");
      container.innerHTML = slide.render();

      document.getElementById("slideIndicator").textContent = `${currentSlide + 1} / ${slides.length}`;
      document.getElementById("prevBtn").disabled = currentSlide === 0;
      document.getElementById("nextBtn").disabled = currentSlide === slides.length - 1;

      document.getElementById("speakerNotesText").textContent = slide.notes;
      document.getElementById("slideViewport").scrollTop = 0;
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        updateView();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        updateView();
      }
    }

    function toggleNotes() {
      const box = document.getElementById("speakerNotesBox");
      notesOpen = !notesOpen;
      box.style.display = notesOpen ? "block" : "none";
    }

    // Suporte a Teclado (Desktop)
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " ") nextSlide();
      if (e.key === "ArrowLeft") prevSlide();
      if (e.key.toLowerCase() === "n") toggleNotes();
    });

    // Suporte a Touch Gestures (Swipe em Celulares)
    let touchStartX = 0;
    let touchEndX = 0;
    const viewport = document.getElementById("slideViewport");

    viewport.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    viewport.addEventListener("touchend", (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const diff = touchStartX - touchEndX;
      if (Math.abs(diff) > 40) {
        if (diff > 0) {
          nextSlide(); // Swipe para a esquerda -> Próximo slide
        } else {
          prevSlide(); // Swipe para a direita -> Slide anterior
        }
      }
    }

    // Inicialização
    updateView();
  </script>
